# Rebuild the GOODTIMES site on Netlify every day at 7:00 a.m. Los Angeles time.
#
# GitHub schedules run in UTC, which doesn't follow daylight saving, so this runs at both 14:00 and
# 15:00 UTC. Each run checks which one is 7 a.m. in LA today (14:00 in PDT, 15:00 in PST) and only
# that one triggers Netlify. Netlify then runs `python3 scrape.py && python3 build.py`; if that build
# fails, Netlify keeps the last successful version of the site live.
#
# Needs one repository secret: NETLIFY_BUILD_HOOK (the build hook URL from Netlify).

name: Daily refresh

on:
  schedule:
    - cron: "0 14 * * *"   # 7:00 a.m. PDT (mid-March to early November)
    - cron: "0 15 * * *"   # 7:00 a.m. PST (early November to mid-March)
  workflow_dispatch:        # "Run workflow" button on the Actions tab, for testing

permissions: {}             # this workflow doesn't need to read or change the repository

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether this run is 7 a.m. in Los Angeles
        id: when
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Los_Angeles date +%z)   # -0700 in PDT, -0800 in PST
          echo "Los Angeles is now $(TZ=America/Los_Angeles date '+%a %b %-d, %-I:%M %p %Z')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: building now."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif { [ "$SCHEDULE" = "0 14 * * *" ] && [ "$offset" = "-0700" ]; } ||
               { [ "$SCHEDULE" = "0 15 * * *" ] && [ "$offset" = "-0800" ]; }; then
            echo "This is the 7 a.m. run for today: building."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "The other daylight-saving slot is today's 7 a.m. run: skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Netlify build
        if: steps.when.outputs.go == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::The NETLIFY_BUILD_HOOK secret isn't set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # -f makes a rejected hook fail this run; the URL itself is never printed.
          curl --silent --show-error --fail --retry 3 --retry-delay 10 \
            -X POST -d '{}' "$HOOK?trigger_title=Daily+refresh+(GitHub+Actions)" -o /dev/null
          echo "Netlify accepted the build request. Follow it under Deploys in Netlify."
